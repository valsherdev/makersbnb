<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.css">
    <title>Listings</title>
</head>
{% extends "base.html" %}
{% block content %}  
<body>
    <nav>
        <ul>
            <li><a href="{{ url_for('get_index') }}">Home</a></li>
            <li><a href="{{ url_for('get_requests_for_owner') }}">View Booking Requests</a></li>
            <li><a href="{{ url_for('see_my_bookings_as_guest') }}">View My Guest Bookings</a></li>
        </ul>
    </nav>
    <h2>List your property</h2>
    <form  method="POST" action="/listings" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Property name"><br>
        <input type="text" name="description" placeholder="Description"><br>
        <input type="number" name="price_per_night" placeholder="Price"><br>
        <label>Choose image</label>
        <input type="file" name="image_upload" id="image_upload"><br>

        <label>Available from</label><br>
        <input type="date" name="start_date" id="start_date", value="{{ today }}", min="{{ today }}">
        <label>Available until</label><br>
        <input type="date" name="end_date" id="end_date">
        <input type="submit" value="Submit">
    </form> 
</body>
</html>

{% endblock %}
